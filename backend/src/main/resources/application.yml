spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
        jdbc:
          batch_size: 100
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        boot:
          allow_jdbc_metadata_access: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  messages:
    basename: messages
    fallback-to-system-locale: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:5184000000}

springdotenv:
  directory: ..

corsAllowedOrigins: http://localhost:5173

server:
  port: 8080
