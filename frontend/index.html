<!doctype html>
<html lang="pl" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Aplikacja do planowania posiłków." />
  <meta name="theme-color" content="#0e1412" />
  <script>
    (function () {
      try {
        var preference = localStorage.getItem('mp_theme') || 'dark';
        var dark = preference === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : preference !== 'light';
        document.documentElement.classList.toggle('dark', dark);
      } catch (error) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Meal Planner" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <title>Meal Planner</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
